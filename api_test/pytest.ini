[pytest]
testpaths = testcases
python_files = test_*.py
pythonpath = .

addopts =
    -v
    -ra
    --alluredir=./allure_results
    --clean-alluredir

; --clean-alluredir：每次跑之前先把上次的结果清空。
; 不加的话结果是【累积】的 —— 跑十次，上一次的失败用例还挂在报告里，
; 你会以为这次也挂了。报告只应该反映"这一次"的结果。

; 打开实时日志：每条请求的 method / url / 状态码 / 耗时都会打出来
; 用例失败时不用猜是哪一步挂了，直接看日志
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S

markers =
    smoke: 冒烟用例，每次提交都跑
    regression: 回归用例，发版前全量跑

; pytest 默认会把用例名里的中文转义成 名字 这种 unicode，
; 数据驱动的用例名全是中文，转义之后完全没法看。
; 这个开关关掉转义，中文就能正常显示了。
; （名字这么长是因为官方不想为这个行为背锅，属于历史遗留命名）
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True
